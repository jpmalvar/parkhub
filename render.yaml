# Blueprint do Render: um único serviço web gratuito.
# O FastAPI serve a API (/api), o WebSocket (/api/ws) e o React compilado (frontend/dist).
services:
  - type: web
    name: parkhub
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: bash render-build.sh
    # O banco SQLite do plano gratuito é temporário: a cada reinício os dados de demonstração são recriados.
    startCommand: cd backend && python -m app.demo && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/docs
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: PARKHUB_SECRET_KEY
        generateValue: true
      - key: PARKHUB_COOKIE_SECURE
        value: "1"
      - key: PARKHUB_TZ
        value: America/Sao_Paulo
